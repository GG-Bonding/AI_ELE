services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: aee
      POSTGRES_PASSWORD: aee
      POSTGRES_DB: aee
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aee -d aee"]
      interval: 3s
      timeout: 5s
      retries: 10
    volumes:
      - aee_pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AEE_DATABASE_URL: postgres://aee:aee@postgres:5432/aee?sslmode=disable
      AEE_SERVER_ADDR: ":8080"
      AEE_LOG_LEVEL: info
    ports:
      - "8080:8080"

volumes:
  aee_pgdata:
