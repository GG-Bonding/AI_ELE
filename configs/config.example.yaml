server:
  addr: ":8080"
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s

database:
  url: "postgres://aee:aee@localhost:5432/aee?sslmode=disable"
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 30m

log:
  level: info
  format: json

llm:
  enabled: false
  base_url: "https://api.openai.com/v1"
  api_key: ""
  model: "gpt-4o-mini"

embedding:
  enabled: false
  base_url: "https://api.openai.com/v1"
  api_key: ""
  model: "text-embedding-3-small"
  dimensions: 1536

evaluator:
  active_min: 0.65
  candidate_min: 0.4

retrieval:
  candidate_top_k: 20
  default_top_k: 20
  default_lambda: 0.02
  tool_scope_lambda: 0.05
  type_lambda:
    SEMANTIC: 0.005
    PROCEDURAL: 0.05
    EPISODIC: 0.03
    FAILURE: 0.04
    CONSTRAINT: 0.01
    PREFERENCE: 0.02

# V3 executable Skill runtime (Shadow/Live). Default off — V2 contracts unchanged.
skill_runtime:
  enabled: false
  shadow_min_executions: 5
  shadow_min_success_rate: 0.90
  suspend_window: 10
  suspend_max_failure_rate: 0.30
  allow_medium_risk_live: false
